    # Ethereum mainnet before `cre secrets`; reads only.
    - chain-name: ethereum-mainnet
      url: https://ethereum-rpc.publicnode.com

# Rehearsals only: a fork of Arc Testnet on node-services (scripts/ops/arc-fork.sh).
simulation-settings:
  rpcs:
    - chain-name: arc-testnet
      url: http://127.0.0.1:8548
