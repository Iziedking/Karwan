# Secrets for karwan-check, karwan-risk and karwan-record. Each name maps to an
# environment variable on the machine that runs the CLI (node-services:
# ~/.karwan-cre-env); values never live in this repository.
secretsNames:
  CRE_WORKFLOW_TOKEN:
    - CRE_WORKFLOW_TOKEN
  GITHUB_REPLAY_TOKEN:
    - CRE_GITHUB_REPLAY_TOKEN
  GITHUB_READ_TOKEN:
    - CRE_GITHUB_READ_TOKEN
  RECORD_SEAL_KEY:
    - CRE_RECORD_SEAL_KEY
