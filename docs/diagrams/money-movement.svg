<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc"><title id="title">Money movement</title><desc id="desc">USDC comes in through Gateway or CCTP, sits in one balance, funds agents and escrow, and pays out; each move follows record, submit, confirm, reconcile, receipt.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AFC95B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#86938A"/></marker></defs><rect width="1600" height="820" rx="24" fill="#0E1311"/><text x="64" y="78" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Money movement</text><text x="64" y="112" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17">Users never need to understand the chain. Every move is recorded before it is sent and reconciled after.</text><rect x="64" y="144" width="26" height="14" rx="4" fill="#151D18" stroke="#2F3D34"/><text x="100" y="156" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Live on Arc testnet</text><rect x="254" y="144" width="26" height="14" rx="4" fill="#151D18" stroke="#2F3D34"/><rect x="254" y="146" width="3" height="10" fill="#AFC95B"/><text x="290" y="156" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Mainnet stage, written and tested</text><rect x="534" y="144" width="26" height="14" rx="4" fill="none" stroke="#86938A" stroke-dasharray="4 3"/><text x="570" y="156" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Planned</text><rect x="64" y="220" width="300" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="84" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Bring money in</text><text x="84" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Gateway deposit address</text><text x="84" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">CCTP from EVM and Solana</text><rect x="424" y="220" width="300" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="444" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">One USDC balance</text><text x="444" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">On Arc, in the user wallet</text><text x="444" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Passkey wallet on mainnet</text><rect x="784" y="220" width="300" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="804" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Agent wallets</text><text x="804" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Top up and withdraw</text><text x="804" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">inside user limits</text><rect x="1144" y="220" width="392" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><rect x="1144" y="234" width="4" height="82" rx="2" fill="#AFC95B"/><text x="1164" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Deal escrow</text><text x="1164" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Funds lock under the terms</text><text x="1164" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">release to the seller, or refund</text><text x="1520" y="250" fill="#86938A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">STAGE B</text><line x1="364" y1="275" x2="422" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><line x1="724" y1="275" x2="782" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><line x1="1084" y1="275" x2="1142" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="1144" y="400" width="392" height="100" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="1164" y="432" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Pay out</text><text x="1164" y="458" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Seller balance, or cash out</text><text x="1164" y="480" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">to another chain via CCTP</text><line x1="1340" y1="330" x2="1340" y2="398" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="784" y="400" width="300" height="100" rx="14" fill="#151D18" stroke="#86938A" stroke-width="1.5" stroke-dasharray="8 6"/><text x="804" y="432" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Local payout</text><text x="804" y="458" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Bank and mobile money</text><text x="804" y="480" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">through regulated partners</text><line x1="1142" y1="450" x2="1086" y2="450" stroke="#86938A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/><text x="64" y="580" fill="#86938A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">EVERY MOVE, THE SAME FIVE STEPS</text><rect x="64" y="610" width="276" height="104" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="84" y="642" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Record</text><text x="84" y="668" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Intent persisted</text><text x="84" y="690" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">before anything is sent</text><line x1="340" y1="662" x2="360" y2="662" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="360" y="610" width="276" height="104" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="380" y="642" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Submit</text><text x="380" y="668" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">One writer per move,</text><text x="380" y="690" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">a request id per attempt</text><line x1="636" y1="662" x2="656" y2="662" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="656" y="610" width="276" height="104" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="676" y="642" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Confirm</text><text x="676" y="668" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Receipt, transfer and</text><text x="676" y="690" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">contract state agree</text><line x1="932" y1="662" x2="952" y2="662" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="952" y="610" width="276" height="104" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="972" y="642" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Reconcile</text><text x="972" y="668" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Unclear outcome: look</text><text x="972" y="690" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">it up, never resend</text><line x1="1228" y1="662" x2="1248" y2="662" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="1248" y="610" width="276" height="104" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="1268" y="642" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Receipt</text><text x="1268" y="668" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Reference, amount and</text><text x="1268" y="690" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">status in plain words</text></svg>
