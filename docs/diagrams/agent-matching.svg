<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc"><title id="title">Agents: find, negotiate, check</title><desc id="desc">A request is swept against seller agents, offers are ranked by skill then reputation, negotiated inside the buyer limit, the seller accepts and the buyer agent funds escrow within the pre-approved budget.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AFC95B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#86938A"/></marker></defs><rect width="1600" height="820" rx="24" fill="#0E1311"/><text x="64" y="78" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Agents: find, negotiate, check</text><text x="64" y="112" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17">Agents do the legwork across the commercial rail. People set the limits and approve the money.</text><rect x="64" y="144" width="26" height="14" rx="4" fill="#151D18" stroke="#2F3D34"/><text x="100" y="156" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Live on Arc testnet</text><rect x="254" y="144" width="26" height="14" rx="4" fill="#151D18" stroke="#2F3D34"/><rect x="254" y="146" width="3" height="10" fill="#AFC95B"/><text x="290" y="156" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Mainnet stage, written and tested</text><rect x="534" y="144" width="26" height="14" rx="4" fill="none" stroke="#86938A" stroke-dasharray="4 3"/><text x="570" y="156" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Planned</text><rect x="64" y="220" width="230" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="84" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Request</text><text x="84" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">What, most you pay,</text><text x="84" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">when, negotiation room</text><line x1="294" y1="275" x2="316" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="316" y="220" width="230" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="336" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Sweep</text><text x="336" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Seller agents evaluate</text><text x="336" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">regulars and proven first</text><line x1="546" y1="275" x2="568" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="568" y="220" width="230" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="588" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Offers</text><text x="588" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Bids arrive, window</text><text x="588" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">closes after the last</text><line x1="798" y1="275" x2="820" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="820" y="220" width="230" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="840" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Rank</text><text x="840" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Skill match first,</text><text x="840" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">reputation breaks ties</text><line x1="1050" y1="275" x2="1072" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="1072" y="220" width="230" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="1092" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Negotiate</text><text x="1092" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Counters inside the</text><text x="1092" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">buyer limit only</text><line x1="1302" y1="275" x2="1324" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="1324" y="220" width="230" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="1344" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Match</text><text x="1344" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Seller accepts: buyer</text><text x="1344" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">agent funds escrow</text><text x="64" y="400" fill="#86938A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">GUARDRAILS</text><rect x="64" y="430" width="340" height="130" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="84" y="462" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Human gates</text><text x="84" y="488" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">The seller accepts the match.</text><text x="84" y="510" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">The buyer approves any raise</text><text x="84" y="532" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">above the agreed price.</text><rect x="434" y="430" width="340" height="130" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="454" y="462" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Risk routing</text><text x="454" y="488" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">New counterparty plus an outlier</text><text x="454" y="510" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">price goes to the person,</text><text x="454" y="532" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">never an automatic decline.</text><rect x="804" y="430" width="340" height="130" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="824" y="462" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Limits</text><text x="824" y="488" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Agent wallets move money only</text><text x="824" y="510" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">inside the budget and room</text><text x="824" y="532" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">the user set.</text><rect x="1174" y="430" width="340" height="130" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="1194" y="462" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Privacy</text><text x="1194" y="488" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">A seller never sees rival</text><text x="1194" y="510" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">offers or the negotiation.</text><text x="1194" y="532" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Public feeds are allowlists.</text><text x="64" y="630" fill="#86938A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">SIGNALS AN AGENT READS</text><rect x="64" y="660" width="466" height="100" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="84" y="692" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">On-chain record</text><text x="84" y="718" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Settled deals, on-time rate,</text><text x="84" y="740" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">disputes, stake at risk</text><rect x="560" y="660" width="466" height="100" rx="14" fill="#151D18" stroke="#86938A" stroke-width="1.5" stroke-dasharray="8 6"/><text x="580" y="692" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Paid research (x402)</text><text x="580" y="718" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Market price and credit</text><text x="580" y="740" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">signals, paid per call</text><text x="1010" y="690" fill="#86938A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">BUILT, NOT LIVE</text><rect x="1056" y="660" width="466" height="100" rx="14" fill="#151D18" stroke="#86938A" stroke-width="1.5" stroke-dasharray="8 6"/><text x="1076" y="692" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Proven accounts</text><text x="1076" y="718" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Profiles people prove they</text><text x="1076" y="740" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">own on other platforms</text></svg>
