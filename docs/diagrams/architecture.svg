<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Karwan current architecture</title>
  <desc id="desc">One identity connects personal and business workspaces to the open market, approval boundary, USDC settlement, and trade record.</desc>
  <style>
    .bg { fill: #0b0f0d; }
    .panel { fill: #121a15; stroke: #344238; stroke-width: 2; }
    .accent { fill: #b4d455; }
    .line { stroke: #829b52; stroke-width: 3; fill: none; }
    .title { fill: #f4f5ef; font: 700 34px Arial, sans-serif; }
    .heading { fill: #f4f5ef; font: 700 22px Arial, sans-serif; }
    .body { fill: #b5beb5; font: 400 17px Arial, sans-serif; }
    .small { fill: #8e9b91; font: 400 15px Arial, sans-serif; }
  </style>
  <rect class="bg" width="1400" height="820" rx="24"/>
  <text class="title" x="70" y="82">Karwan current architecture</text>
  <text class="body" x="70" y="118">One identity. Personal and business trade. One customer wallet and USDC balance in v1.</text>

  <rect class="panel" x="70" y="175" width="250" height="180" rx="18"/>
  <circle class="accent" cx="112" cy="220" r="10"/>
  <text class="heading" x="137" y="228">Identity</text>
  <text class="body" x="100" y="272">One person</text>
  <text class="body" x="100" y="300">One login</text>
  <text class="small" x="100" y="334">Customer identity wallet</text>

  <rect class="panel" x="390" y="145" width="290" height="240" rx="18"/>
  <text class="heading" x="425" y="198">Workspaces</text>
  <text class="body" x="425" y="242">Personal workspace</text>
  <text class="body" x="425" y="278">Owner-only business</text>
  <text class="body" x="425" y="314">workspace</text>
  <text class="small" x="425" y="354">Team permissions: roadmap</text>

  <rect class="panel" x="750" y="145" width="290" height="240" rx="18"/>
  <text class="heading" x="785" y="198">Open market</text>
  <text class="body" x="785" y="242">Find supply</text>
  <text class="body" x="785" y="278">Post what we offer</text>
  <text class="body" x="785" y="314">Bring a deal</text>
  <text class="small" x="785" y="354">Goods and services</text>

  <rect class="panel" x="1110" y="145" width="220" height="240" rx="18"/>
  <text class="heading" x="1142" y="198">Review</text>
  <text class="body" x="1142" y="242">Terms</text>
  <text class="body" x="1142" y="278">Counterparty</text>
  <text class="body" x="1142" y="314">Approval</text>
  <text class="small" x="1142" y="354">Before money moves</text>

  <path class="line" d="M320 265H390M680 265H750M1040 265H1110"/>
  <circle class="accent" cx="355" cy="265" r="6"/>
  <circle class="accent" cx="715" cy="265" r="6"/>
  <circle class="accent" cx="1075" cy="265" r="6"/>

  <rect class="panel" x="170" y="505" width="300" height="190" rx="18"/>
  <text class="heading" x="205" y="558">Settlement</text>
  <text class="body" x="205" y="602">USDC on Arc Testnet</text>
  <text class="body" x="205" y="638">Milestones and release</text>
  <text class="small" x="205" y="674">CCTP routes where configured</text>

  <rect class="panel" x="550" y="505" width="300" height="190" rx="18"/>
  <text class="heading" x="585" y="558">Trade record</text>
  <text class="body" x="585" y="602">Delivery and evidence</text>
  <text class="body" x="585" y="638">Payment and outcome</text>
  <text class="small" x="585" y="674">Reputation context</text>

  <rect class="panel" x="930" y="505" width="300" height="190" rx="18"/>
  <text class="heading" x="965" y="558">Bounded agents</text>
  <text class="body" x="965" y="602">Search and compare</text>
  <text class="body" x="965" y="638">Prepare versioned offers</text>
  <text class="small" x="965" y="674">No silent funding or release</text>

  <path class="line" d="M1220 385V445H1080V505M895 385V445H700V505M600 385V445H320V505"/>
  <text class="small" x="70" y="770">Operational agent wallets remain separate from the customer identity wallet and balance.</text>
</svg>
