<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Deal lifecycle</title><desc id="desc">Agree, fund, accept, deliver, check, release, record; with refund, reclaim, dispute and automatic ruling exits.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AFC95B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#86938A"/></marker></defs><rect width="1600" height="900" rx="24" fill="#0E1311"/><text x="64" y="78" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Deal lifecycle</text><text x="64" y="112" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17">One flow for services, digital work and goods. Every state has an exit that needs only the two parties and time.</text><rect x="64" y="144" width="26" height="14" rx="4" fill="#151D18" stroke="#2F3D34"/><text x="100" y="156" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Live on Arc testnet</text><rect x="254" y="144" width="26" height="14" rx="4" fill="#151D18" stroke="#2F3D34"/><rect x="254" y="146" width="3" height="10" fill="#AFC95B"/><text x="290" y="156" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Mainnet stage, written and tested</text><rect x="534" y="144" width="26" height="14" rx="4" fill="none" stroke="#86938A" stroke-dasharray="4 3"/><text x="570" y="156" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Planned</text><rect x="64" y="220" width="196" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="84" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">1. Agree</text><text x="84" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Price, milestones,</text><text x="84" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">deadline, review time</text><line x1="260" y1="275" x2="278" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="278" y="220" width="196" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="298" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">2. Fund</text><text x="298" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Buyer locks USDC</text><text x="298" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">terms stored on-chain</text><line x1="474" y1="275" x2="492" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="492" y="220" width="196" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="512" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">3. Accept</text><text x="512" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Seller signs the</text><text x="512" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">same terms hash</text><line x1="688" y1="275" x2="706" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="706" y="220" width="196" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="726" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">4. Deliver</text><text x="726" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Seller marks delivery</text><text x="726" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">with proof</text><line x1="902" y1="275" x2="920" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="920" y="220" width="196" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><rect x="920" y="234" width="4" height="82" rx="2" fill="#AFC95B"/><text x="940" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">5. Check</text><text x="940" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Agents check evidence</text><text x="940" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">buyer reviews</text><line x1="1116" y1="275" x2="1134" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="1134" y="220" width="196" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="1154" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">6. Release</text><text x="1154" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Per milestone, or on</text><text x="1154" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">silence after review</text><line x1="1330" y1="275" x2="1348" y2="275" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="1348" y="220" width="196" height="110" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="1368" y="252" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">7. Record</text><text x="1368" y="278" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Settled deal feeds</text><text x="1368" y="300" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">reputation</text><text x="64" y="368" fill="#86938A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">EXITS, SO NO MONEY WAITS FOREVER</text><rect x="112" y="430" width="300" height="96" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="132" y="462" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Refund</text><text x="132" y="488" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Seller never accepted:</text><text x="132" y="510" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">buyer takes it all back</text><rect x="540" y="430" width="300" height="96" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="560" y="462" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Reclaim</text><text x="560" y="488" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Deadline and grace passed,</text><text x="560" y="510" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">nothing delivered</text><rect x="968" y="430" width="300" height="96" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="988" y="462" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Auto-release</text><text x="988" y="488" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Buyer silent after the</text><text x="988" y="510" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">review window</text><path d="M 376 330 L 376 398 L 262 398 L 262 428" fill="none" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><path d="M 804 330 L 804 398 L 690 398 L 690 428" fill="none" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1232 330 L 1232 398 L 1118 398 L 1118 428" fill="none" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><text x="64" y="600" fill="#86938A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">DISPUTES, TIERED AND BOUNDED</text><rect x="64" y="630" width="276" height="104" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="84" y="662" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Dispute</text><text x="84" y="688" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Either side, once per</text><text x="84" y="710" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">milestone; clocks freeze</text><line x1="340" y1="682" x2="360" y2="682" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="360" y="630" width="276" height="104" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><rect x="360" y="644" width="4" height="76" rx="2" fill="#AFC95B"/><text x="380" y="662" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Automatic ruling</text><text x="380" y="688" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Arbiter proposes a split</text><text x="380" y="710" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">from the evidence</text><line x1="636" y1="682" x2="656" y2="682" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="656" y="630" width="276" height="104" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><rect x="656" y="644" width="4" height="76" rx="2" fill="#AFC95B"/><text x="676" y="662" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Appeal window</text><text x="676" y="688" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">No appeal: the ruling</text><text x="676" y="710" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">applies on its own</text><line x1="932" y1="682" x2="952" y2="682" stroke="#AFC95B" stroke-width="2" marker-end="url(#arrow)"/><rect x="952" y="630" width="276" height="104" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><rect x="952" y="644" width="4" height="76" rx="2" fill="#AFC95B"/><text x="972" y="662" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Admin review</text><text x="972" y="688" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Named reviewers split it</text><text x="972" y="710" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">between the two parties only</text><rect x="1248" y="630" width="276" height="104" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="1268" y="662" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Lapse</text><text x="1268" y="688" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Nobody acted: back to</text><text x="1268" y="710" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">where it was, kept</text><text x="64" y="800" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Liveness bound: every live deal ends within deadline + grace + silence longstop + two dispute timeouts + hold budget.</text><text x="64" y="828" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Emergency pause stops new deals only. It never blocks a release, claim, refund or reclaim.</text></svg>
