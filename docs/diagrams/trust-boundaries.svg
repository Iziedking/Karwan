<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">Who holds what</title><desc id="desc">Users hold their own keys, agents act inside limits, deal money sits in the escrow contract, admin roles are bounded.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#AFC95B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#86938A"/></marker></defs><rect width="1600" height="760" rx="24" fill="#0E1311"/><text x="64" y="78" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Who holds what</text><text x="64" y="112" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17">Trust the contract, not the platform. Karwan can pause new deals or rule on escalations, never take.</text><rect x="64" y="144" width="26" height="14" rx="4" fill="#151D18" stroke="#2F3D34"/><text x="100" y="156" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Live on Arc testnet</text><rect x="254" y="144" width="26" height="14" rx="4" fill="#151D18" stroke="#2F3D34"/><rect x="254" y="146" width="3" height="10" fill="#AFC95B"/><text x="290" y="156" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Mainnet stage, written and tested</text><rect x="534" y="144" width="26" height="14" rx="4" fill="none" stroke="#86938A" stroke-dasharray="4 3"/><text x="570" y="156" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Planned</text><text x="64" y="212" fill="#86938A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">PARTY</text><text x="420" y="212" fill="#86938A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">HELD IN</text><text x="860" y="212" fill="#86938A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">CONTROL</text><rect x="64" y="230" width="1472" height="64" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><rect x="64" y="244" width="4" height="36" rx="2" fill="#AFC95B"/><text x="84" y="262" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start"></text><text x="84" y="268" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Email users</text><text x="420" y="268" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Circle passkey smart wallet</text><text x="860" y="268" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Only the user can sign</text><rect x="64" y="306" width="1472" height="64" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="84" y="338" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start"></text><text x="84" y="344" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Web3 users</text><text x="420" y="344" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Their own wallet</text><text x="860" y="344" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Only the user can sign</text><rect x="64" y="382" width="1472" height="64" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><text x="84" y="414" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start"></text><text x="84" y="420" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Agents</text><text x="420" y="420" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Circle agent wallet</text><text x="860" y="420" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Karwan operates it, inside the user limits</text><rect x="64" y="458" width="1472" height="64" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><rect x="64" y="472" width="4" height="36" rx="2" fill="#AFC95B"/><text x="84" y="490" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start"></text><text x="84" y="496" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Deal money</text><text x="420" y="496" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The escrow contract</text><text x="860" y="496" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Only the agreed terms release it</text><rect x="64" y="534" width="1472" height="64" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><rect x="64" y="548" width="4" height="36" rx="2" fill="#AFC95B"/><text x="84" y="566" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start"></text><text x="84" y="572" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Admin review</text><text x="420" y="572" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Safe, four named reviewers</text><text x="860" y="572" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Splits an escalated dispute between the two parties only</text><rect x="64" y="610" width="1472" height="64" rx="14" fill="#151D18" stroke="#2F3D34" stroke-width="1.5"/><rect x="64" y="624" width="4" height="36" rx="2" fill="#AFC95B"/><text x="84" y="642" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start"></text><text x="84" y="648" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Guardian</text><text x="420" y="648" fill="#F2F4EE" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Bounded role</text><text x="860" y="648" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Holds a claim for a limited time budget</text><text x="64" y="716" fill="#B4BEB6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Either party can act on the escrow directly from their own wallet if Karwan is offline.</text></svg>
