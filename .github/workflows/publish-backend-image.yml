name: Publish backend image

# Build the karwan-api Docker image and push it to GitHub Container Registry.
# Runs on every push to main when the backend or Dockerfile changes, plus
# on manual dispatch. The deploy-backend workflow pulls this tag on the VPS.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/publish-backend-image.yml'
  workflow_dispatch:

concurrency:
  group: publish-backend-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: karwan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d karwan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/karwan_test
      KARWAN_JOBBOARD_ADDR: '0x0000000000000000000000000000000000000001'
      KARWAN_ESCROW_ADDR: '0x0000000000000000000000000000000000000002'
      KARWAN_REPUTATION_ADDR: '0x0000000000000000000000000000000000000003'
      KARWAN_VAULT_ADDR: '0x0000000000000000000000000000000000000004'
      IDENTITY_REGISTRY_ADDR: '0x0000000000000000000000000000000000000005'
      USDC_ADDR: '0x0000000000000000000000000000000000000006'
      AGENT_RUNTIME_V2_ENABLED: '0'
      MATCH_ENGINE_V2_SHADOW: '0'
      NEGOTIATION_V2_SHADOW: '0'
      NEGOTIATION_V2_ENABLED: '0'
      FINANCIAL_COMMANDS_V2_ENABLED: '0'
      EVENT_OUTBOX_V2_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test backend with PostgreSQL
        run: npm --prefix backend run test:ci

      - name: Build backend
        run: npm --prefix backend run build

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Needed to push to GHCR with the auto-provisioned GITHUB_TOKEN.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}
          echo "image=ghcr.io/${REPO_LOWER}/karwan-api" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Two tags every push: :latest (rolling) + :<sha> (immutable).
          # Production should pin to :<sha> in compose for rollback safety.
          tags: |
            ${{ steps.tags.outputs.image }}:latest
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha }}
          # Cache layers in GHCR so subsequent builds reuse the install stage.
          cache-from: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache,mode=max
          platforms: linux/amd64
