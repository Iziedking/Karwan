name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel older runs on the same ref so we don't queue up redundant work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      # These gates existed but ran nowhere, which is how a page and its tour
      # drifted apart unnoticed: the /bridge tour was mounted inside one of the
      # page's four rail cards, so it vanished whenever the user picked another.
      - name: Tour targets and mounts
        run: npm --prefix frontend run check:tours

      - name: Translation parity
        run: npm --prefix frontend run check:i18n

      - name: Application shell contract
        run: npm --prefix frontend run check:shell

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: karwan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d karwan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/karwan_test
      KARWAN_JOBBOARD_ADDR: '0x0000000000000000000000000000000000000001'
      KARWAN_ESCROW_ADDR: '0x0000000000000000000000000000000000000002'
      KARWAN_REPUTATION_ADDR: '0x0000000000000000000000000000000000000003'
      KARWAN_VAULT_ADDR: '0x0000000000000000000000000000000000000004'
      IDENTITY_REGISTRY_ADDR: '0x0000000000000000000000000000000000000005'
      USDC_ADDR: '0x0000000000000000000000000000000000000006'
      AGENT_RUNTIME_V2_ENABLED: '0'
      MATCH_ENGINE_V2_SHADOW: '0'
      NEGOTIATION_V2_SHADOW: '0'
      NEGOTIATION_V2_ENABLED: '0'
      FINANCIAL_COMMANDS_V2_ENABLED: '0'
      EVENT_OUTBOX_V2_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend and PostgreSQL tests
        run: npm --prefix backend run test:ci

      - name: Frontend tests
        run: npm --prefix frontend run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend build
        run: npm --prefix backend run build

      - name: Frontend build
        # Use placeholder env vars so Next.js build doesn't fail on missing
        # NEXT_PUBLIC_* references. CI only checks the build succeeds; the
        # real values are injected by Vercel at deploy time.
        env:
          NEXT_PUBLIC_BACKEND_URL: https://api.karwan.site
          NEXT_PUBLIC_BASE_SEPOLIA_RPC: ''
          NEXT_PUBLIC_SEPOLIA_RPC: ''
        run: npm --prefix frontend run build
