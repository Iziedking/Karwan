[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
# runs=1 minimises deployed bytecode: KarwanEscrow sits at the EIP-170 ceiling,
# so we optimise for size over marginal runtime gas (testnet/challenge context).
optimizer_runs = 1
# viaIR is REQUIRED: the legacy pipeline can't compile the escrow under the
# stack limit, and viaIR (fixed in solc >=0.8.26) also reclaims ~1.6KB of
# bytecode that brings the escrow under the size cap.
via_ir = true
verbosity = 2
gas_reports = ["*"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Medusa and Echidna build only the suite and its tests, and deploy the linked
# libraries themselves at these fixed addresses; forge test keeps linking them
# on its own under the default profile.
[profile.fuzz]
src = "src/suite"
test = "test/suite"
# No such folder: the old scripts link libraries this profile does not.
script = "test/suite/no-scripts"
libraries = [
    "src/suite/settlement/SettlementLib.sol:SettlementLib:0x00000000000000000000000000000000000fa001",
    "src/suite/dispute/DisputeLib.sol:DisputeLib:0x00000000000000000000000000000000000fa002",
    "src/suite/agreement/AgreementTermsLib.sol:AgreementTermsLib:0x00000000000000000000000000000000000fa003",
    "src/suite/agreement/AgreementDeliveryLib.sol:AgreementDeliveryLib:0x00000000000000000000000000000000000fa004",
    "src/suite/agreement/AgreementLib.sol:AgreementLib:0x00000000000000000000000000000000000fa005",
    "src/suite/agreement/AgreementDisputeLib.sol:AgreementDisputeLib:0x00000000000000000000000000000000000fa006",
    "src/suite/time/TimeLib.sol:TimeLib:0x00000000000000000000000000000000000fa007",
    "src/suite/time/TimeDisputeLib.sol:TimeDisputeLib:0x00000000000000000000000000000000000fa008",
    "src/suite/jobs/JobLib.sol:JobLib:0x00000000000000000000000000000000000fa009",
    "src/suite/jobs/BountyLib.sol:BountyLib:0x00000000000000000000000000000000000fa00a",
    "src/suite/jobs/JobDisputeLib.sol:JobDisputeLib:0x00000000000000000000000000000000000fa00b",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"

[etherscan]
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://testnet.arcscan.app/api" }
